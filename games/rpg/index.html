<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니 RPG 모험</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1a1a2e; font-family: system-ui, sans-serif; }
  #wrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { background:#264d1a; display:block; border:4px solid #3e2723; border-radius:6px; }
  #hud {
    position:fixed; top:14px; left:14px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.7);
    font-size:15px; line-height:1.6; z-index:5; background:rgba(0,0,0,0.35); padding:10px 14px; border-radius:10px;
  }
  #hud .big { font-size:18px; font-weight:bold; }
  #back {
    position:fixed; top:14px; right:14px; z-index:5;
    background:rgba(0,0,0,0.5); color:#fff; border:1px solid rgba(255,255,255,0.4);
    padding:8px 14px; border-radius:8px; text-decoration:none; font-size:14px;
  }
  #instructions {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); color:#fff; font-size:13px;
    background:rgba(0,0,0,0.4); padding:6px 14px; border-radius:8px; z-index:5;
  }
  #toast {
    position:fixed; top:90px; left:50%; transform:translate(-50%, -20px); color:#fff; font-size:15px;
    background:rgba(0,0,0,0.65); padding:8px 18px; border-radius:8px; z-index:6;
    opacity:0; transition: opacity .2s, transform .2s;
    pointer-events:none;
  }
  #toast.show { opacity:1; transform:translate(-50%, 0); }

  #battle {
    position:fixed; inset:0; background:rgba(10,10,20,0.92); display:none;
    align-items:center; justify-content:center; z-index:20;
  }
  #battlePanel {
    width:min(560px, 92vw); background:#22263a; border:2px solid #444a6b; border-radius:14px;
    padding:24px; color:#fff;
  }
  .barRow { margin-bottom:16px; }
  .barRow .label { display:flex; justify-content:space-between; font-size:14px; margin-bottom:4px; }
  .barBg { background:#3a3f5c; border-radius:8px; height:14px; overflow:hidden; }
  .barFg { background:#66bb6a; height:100%; transition: width .25s; }
  .barFg.enemy { background:#ef5350; }
  #battleLog { min-height:46px; font-size:14px; color:#ffe082; margin:14px 0; line-height:1.5; }
  #battleActions { display:flex; gap:10px; flex-wrap:wrap; }
  #battleActions button {
    flex:1; min-width:100px; padding:12px; border:none; border-radius:8px; cursor:pointer;
    font-weight:bold; font-size:14px; background:#ffca28;
  }
  #battleActions button:disabled { opacity:0.4; cursor:not-allowed; }
  #enemyName { font-size:1.3rem; font-weight:bold; margin-bottom:10px; text-align:center; }

  #overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.85); color:#fff;
    display:none; align-items:center; justify-content:center; flex-direction:column; z-index:30;
    text-align:center; gap:16px;
  }
  #overlay h2 { font-size:2rem; }
  #overlay button {
    padding:12px 26px; font-size:1rem; border:none; border-radius:8px; cursor:pointer;
    background:#ffca28; font-weight:bold;
  }
</style>
</head>
<body>
<a id="back" href="../../index.html">← 허브로</a>
<div id="hud">
  <div class="big">Lv.<span id="lvl">1</span> 모험가</div>
  <div>HP: <span id="hp">30</span>/<span id="maxHp">30</span></div>
  <div>XP: <span id="xp">0</span>/<span id="xpNext">20</span></div>
  <div>🧪 물약: <span id="potions">1</span></div>
</div>
<div id="toast"></div>
<div id="instructions">방향키 / WASD로 이동 · 몬스터를 만나면 자동으로 전투 시작</div>

<div id="wrap"><canvas id="game" width="720" height="504"></canvas></div>

<div id="battle">
  <div id="battlePanel">
    <div id="enemyName">몬스터</div>
    <div class="barRow">
      <div class="label"><span>적 HP</span><span id="enemyHpText"></span></div>
      <div class="barBg"><div class="barFg enemy" id="enemyHpBar"></div></div>
    </div>
    <div class="barRow">
      <div class="label"><span>내 HP</span><span id="playerHpText"></span></div>
      <div class="barBg"><div class="barFg" id="playerHpBar"></div></div>
    </div>
    <div id="battleLog">전투 시작!</div>
    <div id="battleActions">
      <button id="atkBtn">⚔️ 공격</button>
      <button id="healBtn">🧪 물약 사용</button>
      <button id="runBtn">🏃 도망</button>
    </div>
  </div>
</div>

<div id="overlay">
  <h2 id="overTitle">게임 오버</h2>
  <p id="overText" style="font-size:1.1rem;"></p>
  <button id="restartBtn">다시 시작</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const TILE = 36, COLS = 20, ROWS = 14;

  // tile types: 0 grass, 1 wall, 2 path, 3 water, 4 chest, 5 safe(town), 6 sign
  const grid = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      if (r === 0 || c === 0 || r === ROWS - 1 || c === COLS - 1) row.push(1);
      else row.push(0);
    }
    grid.push(row);
  }
  // town safe zone
  for (let r = 1; r <= 3; r++) for (let c = 1; c <= 4; c++) grid[r][c] = 5;
  // lake
  for (let r = 5; r <= 7; r++) for (let c = 10; c <= 13; c++) grid[r][c] = 3;
  // road
  for (let c = 1; c <= 18; c++) grid[11][c] = 2;
  // scattered trees (single obstacles, kept sparse so paths stay open)
  const trees = [[3,7],[3,8],[6,3],[9,15],[10,6],[4,14],[8,9],[2,10],[5,16],[12,13],[9,5],[6,17]];
  trees.forEach(([r,c]) => { if (grid[r] && grid[r][c] !== undefined && grid[r][c] !== 5) grid[r][c] = 1; });
  // chest
  grid[10][2] = 4;
  // sign
  grid[2][8] = 6;

  let chestOpened = false;

  const player = {
    col: 2, row: 2,
    x: 2 * TILE, y: 2 * TILE,
    fromX: 2*TILE, fromY: 2*TILE, toX: 2*TILE, toY: 2*TILE,
    moving: false, t: 0, dir: 'down',
    level: 1, hp: 30, maxHp: 30, atk: 6, xp: 0, xpNext: 20, potions: 1
  };

  const lvlEl = document.getElementById('lvl');
  const hpEl = document.getElementById('hp');
  const maxHpEl = document.getElementById('maxHp');
  const xpEl = document.getElementById('xp');
  const xpNextEl = document.getElementById('xpNext');
  const potionsEl = document.getElementById('potions');
  const toastEl = document.getElementById('toast');

  function updateHud(){
    lvlEl.textContent = player.level;
    hpEl.textContent = player.hp;
    maxHpEl.textContent = player.maxHp;
    xpEl.textContent = player.xp;
    xpNextEl.textContent = player.xpNext;
    potionsEl.textContent = player.potions;
  }

  function toast(text, ms){
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), ms || 1400);
  }

  function rand(min, max){ return Math.random() * (max - min) + min; }
  function randInt(min, max){ return Math.floor(rand(min, max + 1)); }

  // ---------- Movement ----------
  let inBattle = false;
  let gameOverState = false;

  const dirKeys = {
    arrowup: [0,-1,'up'], w: [0,-1,'up'],
    arrowdown: [0,1,'down'], s: [0,1,'down'],
    arrowleft: [-1,0,'left'], a: [-1,0,'left'],
    arrowright: [1,0,'right'], d: [1,0,'right']
  };

  window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if (!(key in dirKeys)) return;
    e.preventDefault();
    if (inBattle || gameOverState || player.moving) return;
    const [dx, dy, dir] = dirKeys[key];
    player.dir = dir;
    const nc = player.col + dx, nr = player.row + dy;
    const tile = grid[nr] && grid[nr][nc];
    if (tile === undefined || tile === 1 || tile === 3) return;
    player.col = nc; player.row = nr;
    player.fromX = player.x; player.fromY = player.y;
    player.toX = nc * TILE; player.toY = nr * TILE;
    player.moving = true; player.t = 0;
    player._pendingTile = tile;
  });

  function onArrive(tile){
    if (tile === 4 && !chestOpened) {
      chestOpened = true;
      grid[player.row][player.col] = 0;
      player.potions += 2;
      toast('보물 상자 발견! 물약 +2', 1600);
      updateHud();
      return;
    }
    if (tile === 6) {
      toast('표지판: "숲의 몬스터를 조심하세요. 물약은 전투 중 사용할 수 있습니다."', 2200);
      return;
    }
    if (tile === 5) return; // safe zone, no encounter
    let chance = 0;
    if (tile === 0) chance = 0.14;
    else if (tile === 2) chance = 0.05;
    if (Math.random() < chance) startBattle();
  }

  // ---------- Battle ----------
  const enemyPool = [
    { name: '슬라임', hp: 16, atk: 4, xp: 8, minLv: 1 },
    { name: '박쥐', hp: 14, atk: 5, xp: 10, minLv: 1 },
    { name: '고블린', hp: 24, atk: 6, xp: 14, minLv: 2 },
    { name: '늑대', hp: 22, atk: 7, xp: 16, minLv: 2 },
    { name: '오크 전사', hp: 36, atk: 9, xp: 24, minLv: 4 }
  ];

  let enemy = null;

  const battleEl = document.getElementById('battle');
  const enemyNameEl = document.getElementById('enemyName');
  const enemyHpBar = document.getElementById('enemyHpBar');
  const enemyHpText = document.getElementById('enemyHpText');
  const playerHpBar = document.getElementById('playerHpBar');
  const playerHpText = document.getElementById('playerHpText');
  const battleLog = document.getElementById('battleLog');
  const atkBtn = document.getElementById('atkBtn');
  const healBtn = document.getElementById('healBtn');
  const runBtn = document.getElementById('runBtn');
  const overlay = document.getElementById('overlay');
  const overTitle = document.getElementById('overTitle');
  const overText = document.getElementById('overText');

  function startBattle(){
    const pool = enemyPool.filter(e => e.minLv <= player.level + 1);
    const base = pool[randInt(0, pool.length - 1)];
    enemy = { name: base.name, maxHp: base.hp, hp: base.hp, atk: base.atk, xp: base.xp };
    inBattle = true;
    battleEl.style.display = 'flex';
    enemyNameEl.textContent = '야생의 ' + enemy.name;
    battleLog.textContent = `${enemy.name}이(가) 나타났다!`;
    refreshBattleUI();
  }

  function refreshBattleUI(){
    enemyHpBar.style.width = Math.max(0, enemy.hp / enemy.maxHp * 100) + '%';
    enemyHpText.textContent = `${Math.max(0,enemy.hp)}/${enemy.maxHp}`;
    playerHpBar.style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
    playerHpText.textContent = `${Math.max(0,player.hp)}/${player.maxHp}`;
    healBtn.disabled = player.potions <= 0;
    updateHud();
  }

  function enemyTurn(){
    if (enemy.hp <= 0) return;
    const dmg = randInt(Math.max(1, enemy.atk - 2), enemy.atk + 2);
    player.hp = Math.max(0, player.hp - dmg);
    battleLog.textContent += `\n${enemy.name}의 공격! ${dmg}의 피해를 입었다.`;
    refreshBattleUI();
    if (player.hp <= 0) {
      setTimeout(() => defeat(), 500);
    }
  }

  function victory(){
    battleLog.textContent = `${enemy.name}을(를) 쓰러뜨렸다! XP +${enemy.xp}`;
    player.xp += enemy.xp;
    let leveledUp = false;
    while (player.xp >= player.xpNext) {
      player.xp -= player.xpNext;
      player.level++;
      player.maxHp += 8;
      player.atk += 2;
      player.hp = player.maxHp;
      player.xpNext = Math.floor(player.xpNext * 1.5);
      leveledUp = true;
    }
    refreshBattleUI();
    setTimeout(() => {
      inBattle = false;
      battleEl.style.display = 'none';
      if (leveledUp) toast(`레벨 업! Lv.${player.level}`, 1800);
    }, 900);
  }

  function defeat(){
    inBattle = false;
    battleEl.style.display = 'none';
    player.hp = Math.ceil(player.maxHp * 0.5);
    player.col = 2; player.row = 2;
    player.x = player.fromX = player.toX = 2 * TILE;
    player.y = player.fromY = player.toY = 2 * TILE;
    toast('쓰러졌다... 마을에서 회복했다.', 2000);
    updateHud();
  }

  atkBtn.addEventListener('click', () => {
    if (!inBattle || enemy.hp <= 0) return;
    const dmg = randInt(Math.max(1, player.atk - 2), player.atk + 3);
    enemy.hp -= dmg;
    battleLog.textContent = `공격! ${enemy.name}에게 ${dmg}의 피해!`;
    refreshBattleUI();
    if (enemy.hp <= 0) {
      victory();
    } else {
      setTimeout(enemyTurn, 500);
    }
  });

  healBtn.addEventListener('click', () => {
    if (!inBattle || player.potions <= 0) return;
    player.potions--;
    const heal = Math.floor(player.maxHp * 0.4);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    battleLog.textContent = `물약을 사용해 HP를 ${heal} 회복했다.`;
    refreshBattleUI();
    setTimeout(enemyTurn, 500);
  });

  runBtn.addEventListener('click', () => {
    if (!inBattle) return;
    if (Math.random() < 0.55) {
      battleLog.textContent = '도망에 성공했다!';
      refreshBattleUI();
      setTimeout(() => { inBattle = false; battleEl.style.display = 'none'; }, 600);
    } else {
      battleLog.textContent = '도망에 실패했다!';
      refreshBattleUI();
      setTimeout(enemyTurn, 500);
    }
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    location.reload();
  });

  // ---------- Render ----------
  const colors = {
    0: '#3f7d32', 1: '#2e4620', 2: '#c2a878', 3: '#2f6fa8', 4: '#8d6e63', 5: '#7c6a53', 6: '#8d6e63'
  };

  function drawTile(r, c){
    const t = grid[r][c];
    ctx.fillStyle = colors[t] || '#3f7d32';
    ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
    if (t === 1) {
      ctx.fillStyle = '#1b5e20';
      ctx.beginPath();
      ctx.arc(c*TILE + TILE/2, r*TILE + TILE/2, TILE*0.38, 0, Math.PI*2);
      ctx.fill();
    } else if (t === 3) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(c*TILE, r*TILE + TILE*0.4, TILE, 3);
    } else if (t === 4) {
      ctx.fillStyle = chestOpened ? '#5d4037' : '#ffca28';
      ctx.fillRect(c*TILE + 6, r*TILE + 10, TILE - 12, TILE - 16);
    } else if (t === 6) {
      ctx.fillStyle = '#efebe9';
      ctx.fillRect(c*TILE + TILE/2 - 2, r*TILE + 8, 4, TILE - 14);
      ctx.fillRect(c*TILE + 8, r*TILE + 6, TILE - 16, 10);
    }
  }

  function drawMap(){
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) drawTile(r, c);
  }

  function drawPlayer(){
    const px = player.x + TILE/2, py = player.y + TILE/2;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(px, py + TILE*0.3, TILE*0.28, TILE*0.12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1e88e5';
    ctx.beginPath(); ctx.arc(px, py, TILE*0.32, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffe0b2';
    ctx.beginPath(); ctx.arc(px, py - TILE*0.18, TILE*0.16, 0, Math.PI*2); ctx.fill();
    // direction indicator
    ctx.fillStyle = '#212121';
    let ix = px, iy = py;
    if (player.dir === 'up') iy -= TILE*0.3;
    if (player.dir === 'down') iy += TILE*0.05;
    if (player.dir === 'left') ix -= TILE*0.28;
    if (player.dir === 'right') ix += TILE*0.28;
    ctx.beginPath(); ctx.arc(ix, iy - TILE*0.18, 3, 0, Math.PI*2); ctx.fill();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (player.moving) {
      player.t += dt / 0.14;
      if (player.t >= 1) {
        player.t = 1;
        player.moving = false;
        player.x = player.toX; player.y = player.toY;
        onArrive(player._pendingTile);
      } else {
        player.x = player.fromX + (player.toX - player.fromX) * player.t;
        player.y = player.fromY + (player.toY - player.fromY) * player.t;
      }
    }

    drawMap();
    drawPlayer();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  updateHud();
})();
</script>
</body>
</html>
